<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist OneDrive - Joltech</title>
<style>
:root{--blue:#002a69;--turq:#00ffe2;--gray:#d6e4e9;--ink:#17324d;}
*{box-sizing:border-box} body{margin:0;background:#f5f8fa;font-family:"Object Sans",Arial,sans-serif;color:var(--ink)}
.wrap{max-width:760px;margin:28px auto;background:white;min-height:900px;box-shadow:0 12px 40px #002a6918;border-radius:22px;overflow:hidden;position:relative}
.hero{height:150px;background:#002a69;position:relative;overflow:hidden}
.hero:before{display:none!important;content:none!important}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:145px;z-index:2}
.content{padding:34px 52px 100px}
h1{font-size:30px;line-height:1.1;color:var(--blue);margin:0 0 8px;font-weight:800} .lead{margin:0 0 24px;color:#4c6277;font-size:16px}
.progress-card{display:flex;align-items:center;gap:18px;background:#f2fbfa;border:1px solid #d5f6f1;border-radius:16px;padding:15px 18px;margin-bottom:22px}
.percent{font-size:34px;font-weight:800;color:var(--blue);min-width:86px} .bar{height:10px;background:#dce7eb;border-radius:999px;overflow:hidden;flex:1} .fill{height:100%;width:0;background:var(--turq);transition:.25s}
.item{display:flex;gap:14px;align-items:flex-start;padding:14px 14px;border-radius:12px;cursor:pointer;transition:.18s;margin:5px 0} .item:hover{background:#f7fafb} input{display:none}
.box{width:24px;height:24px;border:2px solid #86a0b7;border-radius:6px;flex:0 0 24px;position:relative;margin-top:-1px} input:checked+.box{background:var(--blue);border-color:var(--blue)} input:checked+.box:after{content:"✓";position:absolute;color:white;font-weight:800;left:4px;top:-1px;font-size:17px} input:checked~span:last-child{color:#5a7185;text-decoration:line-through}
.done{display:none;margin-top:24px;padding:22px;border-radius:16px;background:var(--blue);color:white;text-align:center} .done strong{display:block;color:var(--turq);font-size:36px;margin-bottom:4px} .done p{margin:0;font-size:18px;font-weight:700}
.actions{display:flex;justify-content:flex-end;margin-top:18px} button{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:8px 10px}
.footer{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--blue) 0 49.5%,white 49.5% 50.5%,var(--turq) 50.5%)}
@media(max-width:650px){.wrap{margin:0;border-radius:0;min-height:100vh}.content{padding:28px 24px 90px}h1{font-size:25px}}

.final-note{margin:14px 4px 0;text-align:center;color:#6d8192;font-size:13px;line-height:1.45}

<section class="content"><h1>📋 CHECKLIST — ¿TU ONEDRIVE ESTÁ LISTO?</h1><p class="lead">Marca cada punto a medida que lo completes. Tu avance se actualizará automáticamente.</p>
<div class="progress-card"><div class="percent" id="pct">0%</div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="list"><label class="item"><input type="checkbox"><span class="box"></span><span>Mis archivos están correctamente sincronizados.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Eliminé información que ya no necesito.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Organicé mis carpetas.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Revisé los nombres de archivos y carpetas.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Retiré las etiquetas de confidencialidad.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Revisé mis archivos compartidos.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Identifiqué mis documentos importantes.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Verifiqué que la información crítica esté correctamente almacenada.</span></label>
<label class="item"><input type="checkbox"><span class="box"></span><span>Consulté a TI sobre cualquier información que no estoy seguro(a) de conservar.</span></label></div>
<div class="done" id="done"><strong>100%</strong><p>¡Listo! Tu OneDrive está preparado para la migración.</p></div>
<p class="final-note">Gracias por completar el checklist. Tu apoyo nos ayuda a realizar una migración más ordenada y segura.</p><div class="actions"><button id="reset">Reiniciar checklist</button></div></section><div class="footer"></div></main>
<script>
const boxes=[...document.querySelectorAll('input[type=checkbox]')], pct=document.getElementById('pct'), fill=document.getElementById('fill'), done=document.getElementById('done');
function update(){const n=boxes.filter(x=>x.checked).length; const p=Math.round(n/boxes.length*100); pct.textContent=p+'%'; fill.style.width=p+'%'; done.style.display=p===100?'block':'none'; if(p===100) done.scrollIntoView({behavior:'smooth',block:'nearest'});}
boxes.forEach(x=>x.addEventListener('change',update)); document.getElementById('reset').onclick=()=>{boxes.forEach(x=>x.checked=false);update();window.scrollTo({top:0,behavior:'smooth'})}; update();
</script></body></html>
